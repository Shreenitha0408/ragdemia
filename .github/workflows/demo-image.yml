name: Demo image

# Builds the self-contained public-demo container and publishes it to GitHub Container
# Registry (free for public repositories): ghcr.io/<owner>/ragdemia-demo:latest
on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "config.yaml", "pyproject.toml", "deploy/container/**", ".github/workflows/demo-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ragdemia-demo" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=RAGDemia public demo (sample corpus, prebuilt index)
          cache-from: type=gha
          cache-to: type=gha,mode=max
